<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会话纪要组件 - 原生示例</title>
  <script type="module" src="../../dist/megaview-ui.es.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
    }
    .controls {
      margin-bottom: 20px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    button {
      margin-right: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>深维会话纪要组件示例</h1>
  
  <div class="controls">
    <button onclick="updateData()">更新数据</button>
    <button onclick="switchToOrangeTheme()">橙色主题</button>
    <button onclick="switchToGreenTheme()">绿色主题</button>
    <button onclick="switchToDefaultTheme()">默认主题</button>
  </div>
  
  <megaview-conversation-summary
    id="summary">
  </megaview-conversation-summary>
  
  <script>
    const summary = document.getElementById('summary');
    
    // 初始数据 - 使用真实的数据结构
    const data = {
      conversation_id: 349488961,
      summary_status: 2,
      summary_result: [
        {
          instruction_id: 968,
          name: "销售XXX",
          question_name: "销售是否处理了客户的异议",
          answer_desc: "首先判断客户是否提出异议...",
          create_at: "2025-11-25 07:02:51",
          answers: [
            {
              content: "否",
              context: [
                {
                  begin_time: 1763207700,
                  end_time: 1763207700,
                  content: "哈喽哈喽，我是雅思官方认证的助教老师 Cicy (可以叫我 小站-刘亦菲[呲牙] ) 你叫什么名字鸭~~~~",
                  speaker_id: 539147,
                  speaker_type: "user",
                  speaker_name: "",
                  order: 0
                }
              ],
              reasoning_process: "客户未在对话中提出任何异议，且销售也未针对任何异议进行回应或处理。"
            }
          ]
        },
        {
          instruction_id: 4267,
          name: "会话总结",
          question_name: "会话总结",
          answer_desc: "请用一段话总结本次会话沟通的内容",
          create_at: "2025-11-25 07:02:51",
          answers: [
            {
              content: "本次对话为销售与客户的初次接触，销售进行了自我介绍并亲切问候客户，但客户尚未提供任何个人信息或具体诉求，双方未深入讨论关于雅思学习、考试计划或相关背景信息。",
              context: [],
              reasoning_process: ""
            }
          ]
        },
        {
          instruction_id: 4266,
          name: "客户档案",
          question_name: "客户档案",
          answer_desc: "生成客户档案",
          create_at: "2025-11-25 07:02:51",
          answers: [
            {
              content: "学生基本信息：未提及\n家庭情况：未提及\n诉求：未提及",
              context: [],
              reasoning_process: ""
            }
          ]
        }
      ]
    };
    
    summary.setAttribute('data', JSON.stringify(data));
    
    // 监听事件
    summary.addEventListener('section-expand', (e) => {
      console.log('展开问题：', e.detail.questionIndex);
    });
    
    summary.addEventListener('section-collapse', (e) => {
      console.log('折叠问题：', e.detail.questionIndex);
    });
    
    // 控制函数
    function updateData() {
      const newData = {
        ...data,
        summary_result: [
          ...data.summary_result,
          {
            instruction_id: 999,
            name: "测试",
            question_name: "测试问题 - " + new Date().toLocaleTimeString(),
            answer_desc: "测试描述",
            create_at: new Date().toISOString(),
            answers: [
              {
                content: "这是测试答案内容",
                context: [],
                reasoning_process: ""
              }
            ]
          }
        ]
      };
      summary.updateData(newData);
    }

    // 主题切换函数
    function switchToOrangeTheme() {
      document.documentElement.style.setProperty('--megaview-color-primary', '#ff6b35');
      document.documentElement.style.setProperty('--megaview-color-primary-bg', 'rgba(255, 107, 53, 0.1)');
      document.documentElement.style.setProperty('--megaview-color-text', '#2d3748');
      document.documentElement.style.setProperty('--megaview-color-text-secondary', '#4a5568');
      document.documentElement.style.setProperty('--megaview-color-bg', '#f8f9fa');
      document.documentElement.style.setProperty('--megaview-color-surface', '#ffffff');
      document.documentElement.style.setProperty('--megaview-color-border', '#e2e8f0');
      document.documentElement.style.setProperty('--megaview-color-hover', '#edf2f7');
    }

    function switchToGreenTheme() {
      document.documentElement.style.setProperty('--megaview-color-primary', '#10b981');
      document.documentElement.style.setProperty('--megaview-color-primary-bg', 'rgba(16, 185, 129, 0.1)');
      document.documentElement.style.setProperty('--megaview-color-text', '#1f2937');
      document.documentElement.style.setProperty('--megaview-color-text-secondary', '#374151');
      document.documentElement.style.setProperty('--megaview-color-bg', '#f0fdf4');
      document.documentElement.style.setProperty('--megaview-color-surface', '#ffffff');
      document.documentElement.style.setProperty('--megaview-color-border', '#d1fae5');
      document.documentElement.style.setProperty('--megaview-color-hover', '#ecfdf5');
    }

    function switchToDefaultTheme() {
      // 重置为默认值
      document.documentElement.style.removeProperty('--megaview-color-primary');
      document.documentElement.style.removeProperty('--megaview-color-primary-bg');
      document.documentElement.style.removeProperty('--megaview-color-text');
      document.documentElement.style.removeProperty('--megaview-color-text-secondary');
      document.documentElement.style.removeProperty('--megaview-color-bg');
      document.documentElement.style.removeProperty('--megaview-color-surface');
      document.documentElement.style.removeProperty('--megaview-color-border');
      document.documentElement.style.removeProperty('--megaview-color-hover');
    }
  </script>
</body>
</html>
