<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深维会话纪要组件 - 开发预览</title>
  <script type="module" src="/src/index.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #fafafa;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .controls {
      margin-bottom: 20px;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      margin-right: 10px;
      margin-bottom: 10px;
      padding: 10px 20px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #40a9ff;
    }
    button:active {
      background: #096dd9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>深维会话纪要组件</h1>
    <p class="subtitle">基于 Web Components 的框架无关可视化组件库</p>
    
    <div class="controls">
      <button onclick="updateData()">更新数据</button>
      <button onclick="changeSize()">改变尺寸</button>
    </div>
    
    <megaview-conversation-summary
      id="summary">
    </megaview-conversation-summary>
  </div>
  
  <script type="module">
    // 使用真实的数据结构
    const data = {
      conversation_id: 349488961,
      summary_status: 2,
      summary_result: [
        {
          instruction_id: 968,
          name: "销售sop八部曲",
          question_name: "销售是否处理了客户的异议",
          answer_desc: "首先判断客户是否提出异议...",
          create_at: "2025-11-25 07:02:51",
          answers: [
            {
              content: "否",
              context: [
                {
                  begin_time: 1763207700,
                  end_time: 1763207700,
                  content: "哈喽哈喽，我是雅思官方认证的助教老师 Cicy (可以叫我 小站-刘亦菲[呲牙] ) 你叫什么名字鸭~~~~",
                  speaker_id: 539147,
                  speaker_type: "user",
                  speaker_name: "",
                  order: 0
                }
              ],
              reasoning_process: "客户未在对话中提出任何异议，且销售也未针对任何异议进行回应或处理。"
            }
          ]
        },
        {
          instruction_id: 4267,
          name: "会话总结",
          question_name: "会话总结",
          answer_desc: "请用一段话总结本次会话沟通的内容",
          create_at: "2025-11-25 07:02:51",
          answers: [
            {
              content: "本次对话为销售与客户的初次接触，销售进行了自我介绍并亲切问候客户，但客户尚未提供任何个人信息或具体诉求，双方未深入讨论关于雅思学习、考试计划或相关背景信息。",
              context: [],
              reasoning_process: ""
            }
          ]
        },
        {
          instruction_id: 4266,
          name: "客户档案",
          question_name: "客户档案",
          answer_desc: "生成客户档案",
          create_at: "2025-11-25 07:02:51",
          answers: [
            {
              content: "学生基本信息：未提及\n家庭情况：未提及\n诉求：未提及",
              context: [],
              reasoning_process: ""
            }
          ]
        }
      ]
    };
    
    const summary = document.getElementById('summary');
    summary.setAttribute('data', JSON.stringify(data));
    
    // 监听事件
    summary.addEventListener('section-expand', (e) => {
      console.log('展开问题索引：', e.detail.questionIndex);
    });
    
    summary.addEventListener('section-collapse', (e) => {
      console.log('折叠问题索引：', e.detail.questionIndex);
    });
    
    // 控制函数
    function updateData() {
      const newData = {
        ...data,
        summary_result: [
          ...data.summary_result,
          {
            instruction_id: 999,
            name: "测试",
            question_name: "测试问题 - " + new Date().toLocaleTimeString(),
            answer_desc: "测试描述",
            create_at: new Date().toISOString(),
            answers: [
              {
                content: "这是测试答案内容",
                context: [],
                reasoning_process: ""
              }
            ]
          }
        ]
      };
      summary.updateData(newData);
    }
    
    let sizeIndex = 0;
    const sizes = [
      { width: '100%', height: 'auto' },
      { width: '800px', height: '600px' },
      { width: '600px', height: '400px' }
    ];
    function changeSize() {
      sizeIndex = (sizeIndex + 1) % sizes.length;
      const size = sizes[sizeIndex];
      summary.setAttribute('width', size.width);
      summary.setAttribute('height', size.height);
      console.log('尺寸变更：', size);
    }
    
    // 将函数暴露到全局作用域
    window.updateData = updateData;
    window.changeSize = changeSize;
  </script>
</body>
</html>
